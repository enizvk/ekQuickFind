name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Adds "Run workflow" in the Actions tab; the startup benchmark only runs that way.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Unit tests, lint, ktlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew :core:search:test testDebugUnitTest :app:testStoreDebugUnitTest :app:testDirectDebugUnitTest
      - name: Android lint and ktlint
        run: ./gradlew lintDebug :app:lintStoreDebug :app:lintDirectDebug ktlintCheck
      - name: Minified build
        run: ./gradlew :app:assembleStoreBenchmarkRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/

  startup-benchmark:
    name: Startup regression (Android 17 emulator)
    # The emulator run is slow and flaky on hosted runners; run it by hand from the Actions tab.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build benchmark APKs
        run: ./gradlew :app:assembleStoreBenchmarkRelease :benchmark:assembleBenchmarkRelease
      - name: Run startup benchmark
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 37
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            ./gradlew :app:installStoreBenchmarkRelease :benchmark:installBenchmarkRelease
            adb shell am instrument -w -e class com.ekquickfind.benchmark.StartupBenchmark#coldStartWithBaselineProfile,com.ekquickfind.benchmark.StartupBenchmark#coldStartWithoutProfile -e androidx.benchmark.suppressErrors EMULATOR,UNLOCKED,LOW-BATTERY com.ekquickfind.benchmark/androidx.test.runner.AndroidJUnitRunner
            adb pull /sdcard/Android/media/com.ekquickfind.benchmark/com.ekquickfind.benchmark-benchmarkData.json benchmarkData.json
      # Emulator timings differ from phones, so CI compares against its own baseline.
      # First run: no CI baseline yet, so record one and upload it for committing.
      - name: Compare with CI baseline (fail if P50 regresses > 15 %)
        run: |
          if [ -f benchmark/startup-baseline-ci.json ]; then
            python3 scripts/check_startup_regression.py benchmarkData.json benchmark/startup-baseline-ci.json 0.15
          else
            python3 -c "import json;d=json.load(open('benchmarkData.json'));json.dump({b['name']:round(b['metrics']['timeToInitialDisplayMs']['median'],1) for b in d['benchmarks'] if 'timeToInitialDisplayMs' in b['metrics']},open('startup-baseline-ci.json','w'),indent=2)"
            echo "No CI baseline yet; recorded startup-baseline-ci.json as an artifact. Commit it to enable the gate."
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark
          path: |
            benchmarkData.json
            startup-baseline-ci.json
