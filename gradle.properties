org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ekQuickFind release info. Bump versionCode for every release; updates only install over a lower one.
ekquickfind.versionCode=4
ekquickfind.versionName=0.3.0
# GitHub repository (owner/name) for the About link and releases. Forks change this one line.
ekquickfind.githubRepo=enizvk/ekQuickFind
# Where the direct-download build looks for update.json (https). Empty uses the repository's latest release;
# set it to "off" to build without self-update. GitHub serves the newest release's files at releases/latest/download/<file>.
ekquickfind.updateFeedUrl=
